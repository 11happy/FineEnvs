<div class="d3-simrl-roadmap"></div>
<style>
  .d3-simrl-roadmap { color: var(--text-color); font-size: 13px; }
  .d3-simrl-roadmap ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: 18px; }
  .d3-simrl-roadmap li { position: relative; margin: 0; padding: 30px 0 0; min-width: 0; }
  /* track: each node draws the segment to the next column; dashed = not built yet */
  .d3-simrl-roadmap li::before { content: ''; position: absolute; left: 12px; right: -18px; top: 15px; border-top: 1px dashed color-mix(in srgb, var(--muted-color) 45%, transparent); }
  .d3-simrl-roadmap li:last-child::before { right: 0; }
  .d3-simrl-roadmap .mk { position: absolute; left: 0; top: 10px; width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted-color); background: var(--surface-bg, var(--page-bg)); box-sizing: content-box; }
  /* built: filled marker, solid track to the next built step */
  .d3-simrl-roadmap li.done .mk { background: var(--primary-color); border-color: var(--primary-color); }
  .d3-simrl-roadmap li.done:has(+ li.done)::before { border-top-style: solid; border-top-color: var(--primary-color); }
  .d3-simrl-roadmap .now-lab { position: absolute; left: 18px; top: 0; font-size: 11.5px; line-height: 1; color: var(--muted-color); font-weight: 600; }
  .d3-simrl-roadmap li.done .now-lab { color: var(--primary-color); }
  .d3-simrl-roadmap .h { font-weight: 600; line-height: 1.3; }
  .d3-simrl-roadmap .d { margin-top: 3px; font-size: 12px; line-height: 1.4; color: var(--muted-color); }
  .d3-simrl-roadmap .by { margin-top: 4px; font-size: 11.5px; line-height: 1.35; color: var(--text-color); }
  @media (max-width: 640px) {
    .d3-simrl-roadmap ol { grid-template-columns: 1fr; row-gap: 14px; }
    .d3-simrl-roadmap li { padding: 0 0 0 24px; }
    .d3-simrl-roadmap li::before { left: 5px; right: auto; top: 14px; bottom: -14px; border-top: none; border-left: 1px dashed color-mix(in srgb, var(--muted-color) 45%, transparent); }
    .d3-simrl-roadmap li:last-child::before { display: none; }
    .d3-simrl-roadmap li.done:has(+ li.done)::before { border-left-style: solid; border-left-color: var(--primary-color); }
    .d3-simrl-roadmap .mk { top: 4px; }
    .d3-simrl-roadmap .now-lab { position: static; display: inline; margin-left: 6px; }
  }
</style>
<script>
  (() => {
    const scriptEl = document.currentScript;
    const boot = () => {
      let root = scriptEl ? scriptEl.previousElementSibling : null;
      if (!(root && root.classList && root.classList.contains('d3-simrl-roadmap'))) {
        root = [...document.querySelectorAll('.d3-simrl-roadmap')].filter((e) => e.dataset.mounted !== 'true').pop();
      }
      if (!root || root.dataset.mounted === 'true') return;
      root.dataset.mounted = 'true';
      const NODES = [
        { h: 'v1 · PortSimEnv', d: 'one quay, one plan, graded once', by: 'FineEnvs', done: true },
        { h: 'v2–v3 · The live port', d: 'news watch by watch, freezes, pilots and tugs', by: 'Edgar Arakelyan, Scale AI', done: true },
        { h: 'v4–v5 · Weather and ships', d: 'real wind and forecasts, ships that answer back', by: 'Edgar Arakelyan, Scale AI', done: true },
        { h: 'Another job · RailSimEnv', d: 'train dispatching through real disruptions', by: 'Bhavish Pahwa', done: true },
        { h: 'Post-training', d: 'RL on the training tasks', by: 'open' },
      ];
      root.innerHTML = `<ol aria-label="Roadmap">${NODES.map((n) => `<li${n.done ? ' class="done"' : ''}>
        <span class="mk" aria-hidden="true"></span>
        <div class="h">${n.h}<span class="now-lab">${n.done ? 'built' : 'next'}</span></div>
        <div class="d">${n.d}</div>
        <div class="by">${n.done ? 'by ' + n.by : n.by}</div>
      </li>`).join('')}</ol>`;
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true }); else boot();
  })();
</script>
